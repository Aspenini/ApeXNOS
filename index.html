<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />

    <title>ApeXNOS — Gaming Clan</title>
    <meta
      name="description"
      content="ApeXNOS — a group of friends who happen to be really good at games. Meet the squad."
    />
    <meta name="author" content="ApeXNOS Gaming Clan" />
    <link rel="canonical" href="https://apexnos.aspenini.com/" />

    <meta property="og:site_name" content="ApeXNOS" />
    <meta property="og:title" content="ApeXNOS — Gaming Clan" />
    <meta
      property="og:description"
      content="A group of friends who happen to be really good at games."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apexnos.aspenini.com/" />
    <meta property="og:image" content="https://apexnos.aspenini.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ApeXNOS logo on a dark teal backdrop." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ApeXNOS — Gaming Clan" />
    <meta
      name="twitter:description"
      content="A group of friends who happen to be really good at games."
    />
    <meta name="twitter:image" content="https://apexnos.aspenini.com/og.jpg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ApeXNOS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/logo-192.png" />

    <!-- The hero mark is the LCP element; start it before the CSS resolves.
         srcset/sizes must mirror the <picture> below exactly, or the browser
         preloads one candidate and then downloads a different one. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/logo-128.avif 128w, /logo-256.avif 256w"
      imagesizes="120px"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ApeXNOS",
        "alternateName": "ApeXNOS Gaming Clan",
        "url": "https://apexnos.aspenini.com/",
        "logo": "https://apexnos.aspenini.com/logo-512.png",
        "description": "A group of friends who happen to be really good at games."
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="backdrop" aria-hidden="true">
      <div class="backdrop-aurora"></div>
      <div class="backdrop-aurora backdrop-aurora--alt"></div>
      <div class="backdrop-grid"></div>
      <canvas class="backdrop-field" id="field"></canvas>
      <div class="backdrop-spotlight" id="spotlight"></div>
      <div class="backdrop-vignette"></div>
      <div class="backdrop-noise"></div>
    </div>

    <main id="main">
      <section id="home" class="hero" data-reveal>
        <div class="hero-mark">
          <span class="hero-ring" aria-hidden="true"></span>
          <span class="hero-ring hero-ring--delay" aria-hidden="true"></span>
          <picture>
            <source type="image/avif" srcset="/logo-128.avif 128w, /logo-256.avif 256w" sizes="120px" />
            <source type="image/webp" srcset="/logo-128.webp 128w, /logo-256.webp 256w" sizes="120px" />
            <img
              src="/logo-256.webp"
              alt="ApeXNOS logo"
              class="hero-logo"
              width="256"
              height="256"
              fetchpriority="high"
            />
          </picture>
        </div>

        <p class="eyebrow">
          <span class="eyebrow-pulse" aria-hidden="true"></span>
          Gaming clan
        </p>

        <h1 class="hero-title">
          <span class="hero-title-text" data-scramble>ApeXNOS</span>
        </h1>

        <p class="lead">
          A group of friends who happen to be really good at games. We're not pros — but we play
          like we are.
        </p>
      </section>

      <section id="roster" class="section" data-reveal>
        <div class="section-head">
          <p class="eyebrow">Roster</p>
          <h2>The squad</h2>
          <p class="section-sub">Swipe, drag, or hit the arrows — meet the crew.</p>
        </div>

        <div
          class="carousel"
          data-carousel
          role="group"
          aria-roledescription="carousel"
          aria-label="Squad members"
        >
          <button
            type="button"
            class="carousel-btn carousel-btn--prev"
            data-carousel-prev
            aria-label="Previous member"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
          </button>

          <div class="carousel-stage" data-carousel-stage>
            <ul class="carousel-track" data-carousel-track>
              <!--@roster-->
            </ul>
          </div>

          <button
            type="button"
            class="carousel-btn carousel-btn--next"
            data-carousel-next
            aria-label="Next member"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
            </svg>
          </button>

          <div class="carousel-footer">
            <div class="carousel-dots" data-carousel-dots></div>
            <p class="carousel-live" data-carousel-live aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span class="footer-brand">ApeXNOS</span>
      <span class="footer-copy">&copy; <span data-year>2026</span></span>
    </footer>

    <div id="pwa-toast" class="pwa-toast" hidden role="status" aria-live="polite">
      <span>Update available</span>
      <button type="button" id="pwa-reload">Reload</button>
      <button type="button" id="pwa-dismiss" aria-label="Dismiss">×</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
